# Reusable compliance pipeline (NIST SSDF / EO 14028 / M-22-18 / M-24-15).
# Source-of-truth skill: doolin/dave-skills skills/cicd-golden-pipeline/SKILL.md
# GitLab CI mirror of .github/workflows/golden-pipeline.yml.
#
# Jobs are defined against public Docker images and should run on any
# GitLab runner with the `docker` executor.

# ---------------------------------------------------------------------
# Shared anchors
# ---------------------------------------------------------------------

# With workflow:rules in the caller, all pipelines that reach this file
# have already been filtered. These rules simply say "always run".
.default-rules: &default-rules
  rules:
    - when: on_success

.artifacts-defaults: &artifacts-defaults
  expire_in: 90 days
  when: always

# ---------------------------------------------------------------------
# 0. Validate Commit Prefix (CM-3) — FAST-FAIL GATE
# ---------------------------------------------------------------------
# Every commit subject MUST include a SB-GL-<#> prefix referencing
# the authorizing GitLab issue. This job runs first; if it fails the
# pipeline stops and no downstream jobs execute.
validate-commit-prefix:
  stage: validate-commit
  image:
    name: alpine/git:latest
    entrypoint: [""]
  <<: *default-rules
  before_script:
    - apk add --no-cache jq
  script:
    - |
      set -e

      # CI_COMMIT_BEFORE_SHA is set on push events but can point at an
      # orphan commit if the push was a force-push (the previous head
      # is no longer reachable from the new head in the shallow clone).
      # Detect that case so we can fall back instead of failing with
      # "fatal: Invalid revision range".
      BEFORE_USABLE=
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        if git cat-file -e "$CI_COMMIT_BEFORE_SHA^{commit}" 2>/dev/null; then
          BEFORE_USABLE=1
        else
          echo "warn: CI_COMMIT_BEFORE_SHA ($CI_COMMIT_BEFORE_SHA) not reachable in this shallow clone; treating as force-push and validating head only." >&2
        fi
      fi

      # Determine which commits to validate. Pass the result through
      # shell positional args so the no-range case can inject `-1`.
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        set -- "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      elif [ -n "$BEFORE_USABLE" ]; then
        set -- "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        # No usable push range (new-branch first push with zero SHA,
        # OR force-push leaving the previous SHA orphan). Validate
        # only the head: `git log <SHA>` without -1 walks every
        # reachable ancestor and would fail on history that pre-dates
        # the SB-GL- convention.
        set -- -1 "$CI_COMMIT_SHA"
      fi

      # Write commit log to temp file (avoids subshell variable loss).
      # Stderr is intentionally not suppressed so failures surface in
      # the job trace.
      TMPFILE=$(mktemp)
      git log "$@" --no-merges --format="%H %s" > "$TMPFILE"

      # TSV intermediates for the traceability report.
      # TRACEFILE rows: <sha>\t<ticket_id>\t<subject>  (valid commits)
      # MISSFILE rows:  <sha>\t<subject>               (missing prefix)
      TRACEFILE=$(mktemp)
      MISSFILE=$(mktemp)

      if [ ! -s "$TMPFILE" ]; then
        echo "No non-merge commits to validate."
      else
        FAILED=0
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          sha="${line%% *}"
          subject="${line#* }"
          if echo "$subject" | grep -qE '^SB-GL-[0-9]+'; then
            iid=$(echo "$subject" | sed -nE 's/^SB-GL-([0-9]+).*/\1/p')
            printf '%s\t%s\t%s\n' "$sha" "$iid" "$subject" >> "$TRACEFILE"
            echo " ok : $sha — $subject"
          else
            printf '%s\t%s\n' "$sha" "$subject" >> "$MISSFILE"
            echo "FAIL: $sha"
            echo "      subject: $subject"
            echo "      missing SB-GL-<#> prefix"
            FAILED=1
          fi
        done < "$TMPFILE"
      fi
      rm -f "$TMPFILE"

      # Emit traceability-report.json regardless of validation outcome
      # (CM-3 evidence — see
      # docs/ticket-conventions.md#commit-to-ticket-traceability).
      commits_json=$(jq -nR --arg project_url "$CI_PROJECT_URL" '
        [inputs | split("\t") | {
          sha: .[0],
          ticket_id: (.[1] | tonumber),
          ticket_ref: ("SB-GL-" + .[1]),
          ticket_url: ($project_url + "/-/work_items/" + .[1]),
          subject: .[2]
        }]
      ' "$TRACEFILE")
      missing_json=$(jq -nR '
        [inputs | split("\t") | { sha: .[0], subject: .[1] }]
      ' "$MISSFILE")
      jq -n --arg pipeline_id "$CI_PIPELINE_ID" \
            --arg head_commit "$CI_COMMIT_SHA" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson commits "$commits_json" \
            --argjson missing "$missing_json" \
            '{
              schema_version: 1,
              pipeline_id: $pipeline_id,
              head_commit: $head_commit,
              generated_at: $generated_at,
              commits: $commits,
              missing_prefix: $missing
            }' > traceability-report.json
      rm -f "$TRACEFILE" "$MISSFILE"

      if [ "${FAILED:-0}" -eq 1 ]; then
        echo ""
        echo "Every commit subject must start with SB-GL-<#> (GitLab issue number)."
        echo "Example: SB-GL-20 Add commit prefix validation gate"
        exit 1
      fi
      echo ""
      echo "All commits have valid SB-GL-<#> prefix."
  after_script:
    - |
      event="{\"event\":\"validate_commit_prefix\",\"severity\":\"info\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-validate-commit.json
  artifacts:
    <<: *artifacts-defaults
    name: "validate-commit-$CI_COMMIT_SHORT_SHA"
    paths:
      - audit-event-validate-commit.json
      - traceability-report.json

# ---------------------------------------------------------------------
# 1. Secrets Scan (PW.6)
# ---------------------------------------------------------------------
secrets-scan:
  stage: compliance-check
  image:
    name: zricethezav/gitleaks:v8.22.1
    entrypoint: [""]
  <<: *default-rules
  variables:
    GIT_DEPTH: "0"           # full history scan
  script:
    - gitleaks detect --source=. --no-banner --verbose --report-path=gitleaks-raw.json --report-format=json || true
    - gitleaks detect --source=. --no-banner --verbose
    # Wrap raw output in metadata envelope (Gap 1)
    - |
      findings="[]"
      if [ -f gitleaks-raw.json ] && [ -s gitleaks-raw.json ]; then
        findings=$(cat gitleaks-raw.json)
      fi
      printf '{"generator":"gitleaks","generator_version":"8.22.1","timestamp":"%s","commit":"%s","ref":"%s","scan_scope":"full-history","status":"complete","findings":%s}\n' \
        "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        "$CI_COMMIT_SHA" \
        "$CI_COMMIT_REF_NAME" \
        "$findings" \
        > gitleaks-report.json
      rm -f gitleaks-raw.json
  after_script:
    - |
      event="{\"event\":\"secrets_scan\",\"severity\":\"info\",\"stage\":\"PW.6\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-secrets-scan.json
  artifacts:
    <<: *artifacts-defaults
    name: "gitleaks-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - gitleaks-report.json
      - audit-event-secrets-scan.json

# ---------------------------------------------------------------------
# 2. Test (backend + frontend)
# ---------------------------------------------------------------------
test:
  stage: compliance-check
  image: eclipse-temurin:17-jdk
  <<: *default-rules
  variables:
    # Hermetic H2 tests via the project's `test` profile. Must NOT set
    # SPRING_DATASOURCE_* here — env vars would override H2 config.
    SPRING_PROFILES_ACTIVE: test
    CHROME_BIN: /usr/bin/google-chrome-stable
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
      - $FRONTEND_DIR/node_modules
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl wget gnupg
    - wget -q -O- https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /etc/apt/trusted.gpg.d/google-chrome.gpg
    - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update -qq && apt-get install -y -qq google-chrome-stable
    # Install Node alongside Java so the frontend-maven-plugin doesn't
    # need to download its own each run. Version matches JAVA+NODE
    # combo used on the GitHub pipeline.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs
    - node --version && npm --version
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify
    - cd $FRONTEND_DIR && npm ci
    - npm test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage
    - node scripts/check-coverage.mjs
  after_script:
    - |
      event="{\"event\":\"test\",\"severity\":\"info\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-test.json
  artifacts:
    <<: *artifacts-defaults
    name: "test-reports-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
      - $FRONTEND_DIR/coverage/
      - audit-event-test.json
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

# ---------------------------------------------------------------------
# 2a. E2E (desktop + mobile viewports)
# ---------------------------------------------------------------------
# Uses Microsoft's official Playwright image — Chromium + WebKit +
# Firefox preinstalled, Node preinstalled. Pinned to the same
# version as the @playwright/test dep in src/main/frontend/package.json.
# iPhone 14 Pro emulation (mobile-safari project) uses WebKit, so we
# need an image that has it.
e2e:
  stage: compliance-check
  image: mcr.microsoft.com/playwright:v1.59.1-jammy
  <<: *default-rules
  variables:
    # Playwright caches its browsers in this dir in the base image.
    # Leaving it alone lets the preinstalled browsers be used.
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - $FRONTEND_DIR/node_modules
  script:
    - cd $FRONTEND_DIR
    - npm ci
    - npm run test:e2e
  after_script:
    - |
      event="{\"event\":\"e2e\",\"severity\":\"info\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-e2e.json
  artifacts:
    <<: *artifacts-defaults
    name: "playwright-$CI_COMMIT_SHORT_SHA"
    paths:
      - $FRONTEND_DIR/coverage/playwright/html-report/
      - $FRONTEND_DIR/test-results/
      - audit-event-e2e.json

# ---------------------------------------------------------------------
# 3. Vulnerability Scan (PW.7 / PW.8)
# ---------------------------------------------------------------------
vulnerability-scan:
  stage: compliance-check
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  <<: *default-rules
  variables:
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - apk add --no-cache nodejs npm jq curl bash
  script:
    # npm audit — production deps only
    - cd $FRONTEND_DIR
    - npm ci --omit=dev
    - npm audit --audit-level=$NPM_AUDIT_LEVEL --omit=dev --json > npm-audit.json || true
    - npm audit --audit-level=$NPM_AUDIT_LEVEL --omit=dev
    - cd "$CI_PROJECT_DIR"
    # Trivy — fs scan. JSON evidence first (always captured), then
    # summary, then the gating table run. Uses the same .trivyignore
    # the GitHub pipeline uses so the ignore list stays authoritative.
    - trivy fs --format json --output trivy-results.json --severity $TRIVY_SEVERITY --ignore-unfixed --ignorefile .trivyignore --exit-code 0 .
    - |
      count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json 2>/dev/null || echo 0)
      echo "Trivy findings at severity=$TRIVY_SEVERITY (fixed-only, ignore-unfixed, .trivyignore applied): $count"
      if [ "$count" -gt 0 ]; then
        jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName) | .[] | "\(.VulnerabilityID)\t\(.Severity)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion // "-")"' trivy-results.json
      fi
    - trivy fs --format table --severity $TRIVY_SEVERITY --ignore-unfixed --ignorefile .trivyignore --exit-code 1 .
  after_script:
    - |
      event="{\"event\":\"vulnerability_scan\",\"severity\":\"info\",\"stage\":\"PW.7_PW.8\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-vulnerability-scan.json
  artifacts:
    <<: *artifacts-defaults
    name: "vuln-scan-$CI_COMMIT_SHORT_SHA"
    paths:
      - $FRONTEND_DIR/npm-audit.json
      - trivy-results.json
      - audit-event-vulnerability-scan.json

# ---------------------------------------------------------------------
# 4. SBOM (PW.4)
# ---------------------------------------------------------------------
sbom:
  stage: compliance-sbom
  image: eclipse-temurin:17-jdk
  <<: *default-rules
  needs:
    - job: test
      artifacts: false
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs
    # Install syft (SBOM tool that powers anchore/sbom-action on GitHub)
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - ./mvnw $MAVEN_CLI_OPTS dependency:resolve -DincludeScope=runtime
    - cd $FRONTEND_DIR && npm ci --omit=dev && cd "$CI_PROJECT_DIR"
    - syft . -o cyclonedx-json=sbom.cyclonedx.json
  after_script:
    - |
      event="{\"event\":\"sbom\",\"severity\":\"info\",\"stage\":\"PW.4\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-sbom.json
  artifacts:
    <<: *artifacts-defaults
    name: "sbom-$CI_COMMIT_SHORT_SHA"
    paths:
      - sbom.cyclonedx.json
      - audit-event-sbom.json

# ---------------------------------------------------------------------
# 5. OSCAL (M-24-15)
# ---------------------------------------------------------------------
oscal:
  stage: compliance-oscal
  image: node:22-alpine
  <<: *default-rules
  needs:
    - job: secrets-scan
      artifacts: true
    - job: vulnerability-scan
      artifacts: true
  before_script:
    # Normalize evidence layout to match the generate-oscal.js
    # expectation (flat directory; script looks for *.json by name).
    - mkdir -p evidence
    - cp gitleaks-report.json evidence/ 2>/dev/null || true
    - cp trivy-results.json evidence/ 2>/dev/null || true
    - cp "$FRONTEND_DIR/npm-audit.json" evidence/ 2>/dev/null || true
  script:
    - |
      COMMIT_SHA="$CI_COMMIT_SHA" \
      RUN_ID="$CI_PIPELINE_ID" \
      REPO="$CI_PROJECT_PATH" \
      node scripts/generate-oscal.js evidence/ oscal/
  after_script:
    - |
      event="{\"event\":\"oscal\",\"severity\":\"info\",\"stage\":\"M-24-15\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-oscal.json
  artifacts:
    <<: *artifacts-defaults
    name: "oscal-$CI_COMMIT_SHORT_SHA"
    paths:
      - oscal/
      - audit-event-oscal.json

# ---------------------------------------------------------------------
# 5a. OSCAL Validation (M-24-15 schema assurance)
# ---------------------------------------------------------------------
oscal-validate:
  stage: compliance-oscal
  image: eclipse-temurin:17-jre
  <<: *default-rules
  needs:
    - job: oscal
      artifacts: true
  script:
    - |
      set -e

      OSCAL_CLI_VERSION="1.0.3"
      OSCAL_CLI_ZIP="cli-core-${OSCAL_CLI_VERSION}-oscal-cli.zip"
      OSCAL_CLI_URL="https://repo1.maven.org/maven2/gov/nist/secauto/oscal/tools/oscal-cli/cli-core/${OSCAL_CLI_VERSION}/${OSCAL_CLI_ZIP}"
      OSCAL_CLI_DIR="/opt/oscal-cli"

      echo "Downloading oscal-cli ${OSCAL_CLI_VERSION}..."
      apt-get update -qq && apt-get install -y -qq curl unzip
      mkdir -p "${OSCAL_CLI_DIR}"
      curl -sL "${OSCAL_CLI_URL}" -o "${OSCAL_CLI_DIR}/${OSCAL_CLI_ZIP}"
      unzip -q "${OSCAL_CLI_DIR}/${OSCAL_CLI_ZIP}" -d "${OSCAL_CLI_DIR}"
      export PATH="${OSCAL_CLI_DIR}/bin:${PATH}"

      echo "Validating assessment-results.json..."
      oscal-cli ar validate oscal/assessment-results.json

      echo "Validating component-definition.json..."
      oscal-cli component-definition validate oscal/component-definition.json

      echo "Validating ssp-fragment.json..."
      oscal-cli ssp validate oscal/ssp-fragment.json

      echo "All OSCAL documents validated successfully."
  after_script:
    - |
      event="{\"event\":\"oscal_validate\",\"severity\":\"info\",\"stage\":\"M-24-15\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-oscal-validate.json
  artifacts:
    <<: *artifacts-defaults
    name: "oscal-validate-$CI_COMMIT_SHORT_SHA"
    paths:
      - audit-event-oscal-validate.json

# ---------------------------------------------------------------------
# 6. Verify Evidence
# ---------------------------------------------------------------------
verify-evidence:
  stage: compliance-verify
  image: node:22-alpine
  <<: *default-rules
  needs:
    - job: secrets-scan
      artifacts: true
    - job: test
      artifacts: true
    - job: e2e
      artifacts: true
    - job: vulnerability-scan
      artifacts: true
    - job: sbom
      artifacts: true
    - job: oscal
      artifacts: true
    - job: oscal-validate
      artifacts: true
  before_script:
    - mkdir -p evidence
    # Security scans
    - cp gitleaks-report.json evidence/ 2>/dev/null || true
    - cp trivy-results.json evidence/ 2>/dev/null || true
    - cp "$FRONTEND_DIR/npm-audit.json" evidence/ 2>/dev/null || true
    # SBOM + OSCAL
    - cp sbom.cyclonedx.json evidence/ 2>/dev/null || true
    - cp -r oscal/* evidence/ 2>/dev/null || true
    # Test results and coverage (Gaps 2 & 3)
    - cp -r target/surefire-reports evidence/ 2>/dev/null || true
    - cp -r target/site/jacoco evidence/jacoco-report 2>/dev/null || true
    - cp -r "$FRONTEND_DIR/coverage" evidence/frontend-coverage 2>/dev/null || true
    # Audit events
    - cp audit-event-*.json evidence/ 2>/dev/null || true
    # Pipeline definition (Gap 7)
    - mkdir -p evidence/pipeline-definition
    - cp .gitlab-ci.yml evidence/pipeline-definition/ 2>/dev/null || true
    - cp .gitlab/ci/golden-pipeline.yml evidence/pipeline-definition/ 2>/dev/null || true
  script:
    - |
      COMMIT_SHA="$CI_COMMIT_SHA" \
      RUN_ID="$CI_PIPELINE_ID" \
      REPO="$CI_PROJECT_PATH" \
      node scripts/verify-evidence.js evidence/ evidence-manifest.json
  after_script:
    - |
      event="{\"event\":\"verify_evidence\",\"severity\":\"info\",\"status\":\"$CI_JOB_STATUS\",\"pipeline_id\":\"$CI_PIPELINE_ID\",\"commit\":\"$CI_COMMIT_SHA\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      echo "$event"
      echo "$event" > audit-event-verify-evidence.json
  artifacts:
    <<: *artifacts-defaults
    name: "evidence-manifest-$CI_COMMIT_SHORT_SHA"
    paths:
      - evidence-manifest.json
      - audit-event-verify-evidence.json
