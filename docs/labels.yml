# Canonical label catalog for github.com/doolin/javasprang.
#
# Single source of truth. Edit this file, then run
# `scripts/bootstrap-labels.sh` to apply changes to the live repo.
# The script is idempotent — re-running it is safe.
#
# Conventions documented in docs/ticket-conventions.md.

labels:
  # ---- kind/* — what type of work --------------------------------------
  - name: "kind/bug"
    description: "Something is broken"
    color: "d73a4a"
  - name: "kind/feature"
    description: "New capability for users or the platform"
    color: "0e8a16"
  - name: "kind/chore"
    description: "Housekeeping; no functional change"
    color: "ededed"
  - name: "kind/refactor"
    description: "Internal restructure with no behavior change"
    color: "c5def5"
  - name: "kind/security"
    description: "Security-relevant fix or hardening"
    color: "b60205"
  - name: "kind/docs"
    description: "Documentation only"
    color: "0075ca"
  - name: "kind/test"
    description: "Test coverage / test infrastructure"
    color: "c2e0c6"
  - name: "kind/perf"
    description: "Performance improvement"
    color: "fbca04"
  - name: "kind/compliance"
    description: "Compliance / audit / regulatory work"
    color: "fef2c0"

  # ---- area/* — code or system area ------------------------------------
  - name: "area/backend"
    description: "Spring Boot / Java side"
    color: "5319e7"
  - name: "area/frontend"
    description: "Angular / TypeScript side"
    color: "7057ff"
  - name: "area/ci"
    description: "GitHub Actions / GitLab CI / scripts/"
    color: "1d76db"
  - name: "area/compliance"
    description: "OSCAL / SBOM / attestation pipeline"
    color: "0075ca"
  - name: "area/security"
    description: "Auth, secrets, JWT, vuln remediation"
    color: "e99695"
  - name: "area/deps"
    description: "Dependency upgrades and pins"
    color: "0366d6"
  - name: "area/docs"
    description: "Repo documentation"
    color: "1f6feb"
  - name: "area/infra"
    description: "Hosting / runners / terraform / Pages"
    color: "0e4429"

  # ---- domain/* — functional / business surface ------------------------
  - name: "domain/auth"
    description: "Login, register, JWT lifecycle"
    color: "008672"
  - name: "domain/todo"
    description: "Todo CRUD, statuses"
    color: "006b75"
  - name: "domain/kanban"
    description: "Kanban board UI"
    color: "a2eeef"
  - name: "domain/evidence"
    description: "Evidence manifest / artifact retention"
    color: "e4e669"
  - name: "domain/attestation"
    description: "SLSA provenance / Solana attestation"
    color: "d876e3"

  # ---- priority/* — triage --------------------------------------------
  - name: "priority/p0"
    description: "Drop-everything: security, breakage, compliance gap"
    color: "b60205"
  - name: "priority/p1"
    description: "Next release / current iteration"
    color: "d93f0b"
  - name: "priority/p2"
    description: "When capacity allows"
    color: "fbca04"
  - name: "priority/p3"
    description: "Maybe never; capture for completeness"
    color: "ededed"

  # ---- effort/* — quick-glance sizing ---------------------------------
  - name: "effort/xs"
    description: "Less than 1 hour"
    color: "c2e0c6"
  - name: "effort/s"
    description: "Less than 1 day"
    color: "0e8a16"
  - name: "effort/m"
    description: "1–3 days"
    color: "fbca04"
  - name: "effort/l"
    description: "1+ week"
    color: "d93f0b"
  - name: "effort/xl"
    description: "Sprint or multi-sprint"
    color: "b60205"

  # ---- status/* — lifecycle (Project field is the canonical source) ----
  - name: "status/needs-triage"
    description: "New issue awaiting triage"
    color: "ededed"
  - name: "status/blocked"
    description: "Blocked on internal work"
    color: "b60205"
  - name: "status/blocked-external"
    description: "Blocked on external dependency or upstream"
    color: "5319e7"
  - name: "status/in-progress"
    description: "Actively being worked on"
    color: "1d76db"
  - name: "status/needs-review"
    description: "Implementation done; awaits review"
    color: "fbca04"

  # ---- compliance/* — chart-of-accounts for compliance work -----------
  # These map 1:1 to the audit-event stages in the Golden Pipeline and
  # to OSCAL control IDs. Use on tickets that close compliance work,
  # not on every CVE; suppressed CVEs go in .trivyignore.
  - name: "compliance/ssdf-pw.4"
    description: "SSDF PW.4 — reuse existing well-secured software (SBOM)"
    color: "fef2c0"
  - name: "compliance/ssdf-pw.6"
    description: "SSDF PW.6 — secure compilation/build (secrets scan)"
    color: "fef2c0"
  - name: "compliance/ssdf-pw.7"
    description: "SSDF PW.7 — review human-readable code (vuln scan)"
    color: "fef2c0"
  - name: "compliance/ssdf-pw.8"
    description: "SSDF PW.8 — test executable code (vuln scan)"
    color: "fef2c0"
  - name: "compliance/ssdf-ps.1"
    description: "SSDF PS.1 — protect code from unauthorized access (provenance)"
    color: "fef2c0"
  - name: "compliance/ssdf-ps.2"
    description: "SSDF PS.2 — verify release integrity (provenance)"
    color: "fef2c0"
  - name: "compliance/m-21-31"
    description: "OMB M-21-31 — logging / event forwarding"
    color: "f9d0c4"
  - name: "compliance/m-22-18"
    description: "OMB M-22-18 — self-attestation of SSDF"
    color: "f9d0c4"
  - name: "compliance/m-24-15"
    description: "OMB M-24-15 — OSCAL machine-readable artifacts"
    color: "f9d0c4"
  - name: "compliance/eo-14028"
    description: "Executive Order 14028 — supply-chain transparency"
    color: "d4c5f9"
